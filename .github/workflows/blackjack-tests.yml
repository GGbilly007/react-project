name: Blackjack tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare npm manifest for Linux
        run: cp Package.json package.json

      - name: Install dependencies
        run: npm ci

      - name: Run Blackjack tests
        run: npm test